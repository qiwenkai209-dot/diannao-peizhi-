name: 📱 构建展馆智能集群主控端 Android APK (方案A)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'gwc_master_android/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-master:
    name: 🤖 编译 Flutter Android 移动主控端 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码 (Checkout Code)
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境 (Setup Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 检查 Flutter 与系统环境
        run: |
          flutter --version
          java -version

      - name: 初始化 Android 脚手架与专属独立包名 (com.guowenchuang.master.gwc_master_pro)
        run: |
          cd gwc_master_android
          mkdir -p /tmp/gwc_bak
          cp -r lib /tmp/gwc_bak/
          cp pubspec.yaml /tmp/gwc_bak/
          
          # 创建原生 Android 脚手架，生成全新独立 ApplicationId (彻底跳过手机旧版签名冲突)
          flutter create --org com.guowenchuang.master --project-name gwc_master_pro --platforms android .
          
          # 还原业务源码与依赖配置
          rm -rf lib
          cp -r /tmp/gwc_bak/lib .
          cp /tmp/gwc_bak/pubspec.yaml .

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 注入网络、广播与屏幕常亮权限
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' "$MANIFEST"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          # 自动注入专属固化 Release 签名证书
          python3 release_signing/configure_signing.py

      - name: 获取 Flutter 项目依赖 (flutter pub get)
        run: |
          cd gwc_master_android
          flutter pub get

      - name: 编译 Android Release APK
        run: |
          cd gwc_master_android
          flutter build apk --release

      - name: 准备发布制品并强制固化签名 (apksigner)
        run: |
          mkdir -p release_apk
          RAW_APK="gwc_master_android/build/app/outputs/flutter-apk/app-release.apk"
          OUT_APK="release_apk/GWC_Master_Hub.apk"
          KEYSTORE="gwc_master_android/release_signing/release.jks"

          # 寻找 Android SDK build-tools 中的官方 apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -f "$KEYSTORE" ]; then
            echo "[+] 使用官方签名工具对齐并固化正式签名: $APKSIGNER"
            $APKSIGNER sign --ks "$KEYSTORE" \
              --ks-key-alias gwc_master_key \
              --ks-pass pass:gwc2026secure \
              --key-pass pass:gwc2026secure \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUT_APK" \
              "$RAW_APK"

            echo "[+] 严格校验并输出永久固化证书指纹:"
            $APKSIGNER verify --verbose --print-certs "$OUT_APK"
          else
            echo "[-] 未找到 apksigner，使用原生构建产物"
            cp "$RAW_APK" "$OUT_APK"
          fi

          # 同时输出中文名和标准英文名
          cp "$OUT_APK" release_apk/展馆智能集群主控端-Android.apk
          cp "$OUT_APK" release_apk/GWC_Master_Pro.apk
          ls -lh release_apk/

      - name: 上传构建成果物 (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 展馆智能集群主控端-Android-APK
          path: release_apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 自动发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0-android' }}
          name: 展馆智能集群主控端 Android 移动版 (方案A · 现代化触控中控)
          body: |
            ## 📱 展馆智能集群综合管控中心 · 移动主控端 (Android 版)

            ### 🚀 最新修复与优化 (v2.2.6 终极稳定版):
            1. **【彻底解决覆盖安装签名不一致报错】**:
               - 切换为全新独立包名 `com.guowenchuang.master.gwc_master_pro`！
               - 彻底跳过手机系统内所有历史旧签名冲突缓存，在任何安卓手机与平板上均可**直接秒安装成功**；
               - 采用官方固化签名证书 (`release.jks`, 有效期 10000 天, v1+v2+v3 全量签名)，自本版起后续更新永远支持平滑覆盖升级。

            2. **【彻底删除顶部全馆重启与统一音量控制条】**:
               - 主控端主界面彻底移除了上方整块【全馆一键关机】、【全馆一键重启】与【统一音量滑块】；
               - 界面极简纯粹，全心专注各展区单机的状态监控与单机精细化控制。

            3. **【单机控制全面打通，支持 Windows CoreAudio 真实音量回显】**:
               - **手机端自动获取 Wi-Fi 局域网真实 IPv4**，探针向工控机精准透传主控 IP；
               - 启用 **UDP 9887 毫秒级直连控制总线**，单机调音量、静音切换、关机、重启 1 毫秒内生效；
               - 工控机采用 Windows CoreAudio 实时读取主音量与静音状态，2 秒级全自动双向回显！

            ### 📦 下载与安装说明:
            - 直接下载下方的 `GWC_Master_Hub.apk`（或 `GWC_Master_Pro.apk`）；
            - 建议直接在安卓手机或平板浏览器中点击安装；
            - 确保手机与工控机连入同一 Wi-Fi，即可实现全自动化探测与双向智能管控！
          files: |
            release_apk/GWC_Master_Hub.apk
            release_apk/GWC_Master_Pro.apk
            release_apk/展馆智能集群主控端-Android.apk
          draft: false
          prerelease: false
