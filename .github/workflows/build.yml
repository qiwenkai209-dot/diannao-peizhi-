name: Build & Release Encrypted Application

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-encrypt:
    name: 🛡️ 国文创加壳加密与双模构建
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pillow

      - name: 执行国文创加壳加密构建 (Protect & Build)
        run: |
          python protect_build.py

      - name: 检查并准备发布文件
        run: |
          dir dist\
          if (-not (Test-Path "dist\展馆控制终端.exe")) {
            Write-Error "受控端构建输出文件未找到！"
            exit 1
          }
          if (-not (Test-Path "dist\展馆智能集群主控端.exe")) {
            Write-Error "主控端构建输出文件未找到！"
            exit 1
          }
          Copy-Item "dist\展馆控制终端.exe" -Destination "dist\GWC_Agent_Client.exe"
          Copy-Item "dist\展馆智能集群主控端.exe" -Destination "dist\GWC_Master_Hub.exe"

      - name: 上传构建成果物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 展馆智能集群主控与控制终端独立套件-国文创版
          path: |
            dist/展馆控制终端.exe
            dist/展馆智能集群主控端.exe
            dist/GWC_Agent_Client.exe
            dist/GWC_Master_Hub.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release (自动发布最新版本)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          name: 展馆智能集群管控系统 v2.2 (智能主控端 + 展馆控制终端)
          body: |
            ## 🏛️ 展馆智能集群管控系统 · 国文创主控与受控终端独立双软件版 v2.2

            ### 🌟 本次全新升级特性：
            1. **控制终端（受控端）界面结构与调度全面进化**：
               - **预设应用开机自启与延时启动置顶常驻**：无需繁琐折叠，直接在最上方表格直观勾选开机自启、设定延时秒数、一键测试启动。
               - **界面大气极简，其他功能统合折叠**：运行模式/全局热键、集群连接状态与 TCP/UDP/VNC 端口标注、专属商业授权统筹收纳，保持工作台清爽高效。
               - **极致轻量化守护**：优化显卡探针与高频磁盘读取缓存，空闲时极低系统资源占用，工控机长时间运行稳定如磐石。
            2. **第三方智能中控专享 UDP 控制协议**：
               - 主控端新增专用 **UDP 9889** 控制接口，原生兼容快思聪（Crestron）、AMX、华为中控、智能平板及 Python 脚本等第三方集中中控硬件。
               - 支持纯文本与 JSON 双协议指令，涵盖全馆一键关机、重启、静音、统一音量、预设应用启动与单机精准控制，并支持 ACK 自动应答。
               - 主控端内置【📖 中控UDP指令手册】速查与即时跑马灯调度回显。
            3. **新一代商业授权与远程签发**：
               - 支持按小时、月度、永久自定义时间灵活授权；
               - 未授权/到期顶层强提醒，主控端商业授权中枢支持远程一键签发并实时自动热更新受控端，无需现场逐台敲码。
            4. **局域网集群监控与精细化运维**：
               - 自定义工控机名称、CPU/GPU 实时占用精确监控；
               - 远程工作目录指定、双向文件上传/下载/删除管理、远程一键备份与自动恢复。

            ### 📦 发布文件说明：
            - `展馆控制终端.exe` / `GWC_Agent_Client.exe`: 部署在各展厅工控机，预设应用置顶自启延时管理、轻量守护、开机自启、快捷键呼出。
            - `展馆智能集群主控端.exe` / `GWC_Master_Hub.exe`: 部署在总控电脑，在线终端雷达发现、全馆监控大厅、第三方UDP中控调度中枢。
          files: |
            dist/展馆控制终端.exe
            dist/展馆智能集群主控端.exe
            dist/GWC_Agent_Client.exe
            dist/GWC_Master_Hub.exe
          draft: false
          prerelease: false
