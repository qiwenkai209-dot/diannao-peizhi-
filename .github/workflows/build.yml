name: Build & Release Encrypted Application

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-encrypt:
    name: 🛡️ 国文创加壳加密与打包构建
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 执行国文创加壳加密构建 (Protect & Build)
        run: |
          python protect_build.py

      - name: 检查生成的受保护二进制文件
        run: |
          dir dist\
          if (-not (Test-Path "dist\展馆系统配置与网络设置及电脑优化工具.exe")) {
            Write-Error "构建输出文件未找到！"
            exit 1
          }

      - name: 上传构建成果物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 展馆系统配置与网络设置及电脑优化工具-国文创加密版
          path: dist/展馆系统配置与网络设置及电脑优化工具.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release (自动发布最新版本)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest-release' }}
          name: 展馆系统配置与网络设置及电脑优化工具 (国文创商业授权版)
          body: |
            ## 🛡️ 展馆系统配置与网络设置及电脑优化工具 · 国文创商业授权版

            ### 📦 本次构建说明：
            - **源码保护**：代码已通过国文创商业加壳加密引擎（Universal Shield Engine）混淆加密，内存动态解密执行。
            - **授权体系**：集成动态 8 位申请码与一机一码防二次激活机制，100% 兼容《国文创加密机.exe》。
            - **权限配置**：内置 Windows 管理员 UAC 自动提权，全功能支持网络修复、内存深清、启动项及右键菜单管理。

            ### 🔑 激活指引：
            1. 首次运行软件，弹出【商业授权验证中心】并显示 8 位设备申请码。
            2. 使用《国文创加密机.exe》输入申请码，签发 12 位激活码。
            3. 在软件中粘贴激活码完成即刻解锁与绑定。
          files: |
            dist/展馆系统配置与网络设置及电脑优化工具.exe
          draft: false
          prerelease: false
